<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配乐分析 · 音质 × 取样方案 对比</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b24; --panel2:#1c2230; --line:#2a3240;
    --text:#e7ebf3; --dim:#8b97ab; --good:#3ddc97; --warn:#ffcc66; --bad:#ff6b6b;
    --accent:#6aa9ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;}
  .wrap{max-width:1200px;margin:0 auto;padding:28px 22px 80px}
  h1{font-size:21px;margin:0 0 6px;font-weight:650;letter-spacing:.3px}
  h2{font-size:15px;margin:34px 0 12px;font-weight:600;color:#cfd8e6;
     display:flex;align-items:center;gap:10px}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .meta{color:var(--dim);font-size:12.5px;line-height:1.9}
  .meta b{color:#c7d2e2;font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 15px}
  .card .k{color:var(--dim);font-size:12px;letter-spacing:.4px}
  .card .v{font-size:20px;font-weight:650;margin-top:6px;letter-spacing:.2px}
  .card .s{color:var(--dim);font-size:11.5px;margin-top:4px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--dim);padding:7px 13px;cursor:pointer;font-size:12.5px}
  .seg button.on{background:#22304a;color:#dce7ff}
  .hint{color:var(--dim);font-size:12px}
  table{border-collapse:separate;border-spacing:0;width:100%}
  .matrix{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .matrix th,.matrix td{padding:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .matrix th{background:#131923;color:var(--dim);font-weight:600;font-size:12px;padding:9px 10px;text-align:center}
  .matrix th.rowh{text-align:left;padding-left:14px}
  .matrix td.rowh{background:#131923;color:#c3cddd;font-size:12.5px;padding:10px 14px;white-space:nowrap}
  .cell{padding:11px 10px;cursor:pointer;transition:outline .12s;position:relative}
  .cell:hover{outline:1px solid var(--accent);outline-offset:-1px}
  .cell.sel{outline:2px solid var(--accent);outline-offset:-2px}
  .cell .big{font-size:15px;font-weight:650}
  .cell .sub{font-size:11px;color:var(--dim);margin-top:2px}
  .bars{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .bar-row{display:flex;align-items:center;gap:12px;padding:5px 0;cursor:pointer;border-radius:6px}
  .bar-row:hover{background:#1b2333}
  .bar-row.sel{background:#1d2941}
  .bar-name{width:190px;flex:none;font-size:12.5px;color:#c3cddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-track{flex:1;display:flex;height:20px;border-radius:4px;overflow:hidden;background:#0f1520}
  .bar-track div{height:100%}
  .bar-val{width:70px;flex:none;text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 0;font-size:12px;color:var(--dim)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .detail{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px;font-size:12.5px;color:#c3cddd;min-height:76px}
  .detail .hd{color:#dce7ff;font-weight:600;margin-bottom:6px}
  .detail .kv{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--dim)}
  .detail .kv b{color:#e7ebf3;font-weight:600;font-variant-numeric:tabular-nums}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tag{background:#202a3c;border:1px solid #2d3a52;border-radius:20px;padding:2px 10px;font-size:11.5px;color:#b9c6db}
  .tag b{color:#e7ebf3;font-weight:600}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .tbl{background:var(--panel);font-size:12.5px;min-width:840px}
  .tbl th{position:sticky;top:0;background:#131923;color:var(--dim);font-weight:600;
    padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
  .tbl th:first-child,.tbl th:nth-child(2){text-align:left}
  .tbl th.on{color:#dce7ff}
  .tbl td{padding:8px 10px;text-align:right;border-bottom:1px solid #1b2230;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tbl td:first-child,.tbl td:nth-child(2){text-align:left}
  .tbl tr{cursor:pointer}
  .tbl tr:hover td{background:#1a2231}
  .tbl tr.sel td{background:#1d2941}
  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px}
  .pill.same{background:#173327;color:#77e0ab}
  .pill.diff{background:#3a2430;color:#ff9aa9}
  svg .dot{cursor:pointer;transition:r .1s}
  svg .dot:hover{r:7}
  .foot{margin-top:34px;color:var(--dim);font-size:12px;line-height:1.9;border-top:1px solid var(--line);padding-top:16px}
  ul.take{margin:8px 0 0 18px;padding:0;color:#c3cddd}
  ul.take li{margin:5px 0}
  code{background:#1b2230;padding:1px 6px;border-radius:4px;font-size:12px;color:#a9c4ff}
</style>
</head>
<body>
<div class="wrap">
  <h1>配乐听感分析：音质 × 取样方案 对比</h1>
  <div class="meta" id="meta"></div>

  <div class="cards" id="cards"></div>

  <h2>得分矩阵</h2>
  <div class="toolbar">
    <span class="hint">单元格显示：</span>
    <span class="seg" id="metricSeg"></span>
    <span class="hint">行 = 取样方案，列 = 音质。点格子看细节。</span>
  </div>
  <div class="matrix" id="matrix"></div>

  <h2>时间构成</h2>
  <div class="bars" id="bars"></div>
  <div class="legend" id="legend"></div>

  <h2>成本 vs 保真</h2>
  <div class="hint">横轴 = 每首总耗时（含摊薄加载），纵轴 = 段内得分。左上角为理想区。</div>
  <svg id="scatter" viewBox="0 0 880 330" style="width:100%;height:auto;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px"></svg>

  <h2>明细（点表头排序）</h2>
  <div class="scroll"><table class="tbl" id="tbl"></table></div>

  <div class="detail" id="detail"><div class="hd">点任意格子 / 条形 / 圆点 / 行</div><div class="kv">选中后会在这里显示这一组的完整数据与 top5 标签。</div></div>

  <h2>读出来的结论</h2>
  <ul class="take" id="take"></ul>

  <div class="foot" id="foot"></div>
</div>

<script>
const DATA = {"generatedAt": "2026-11-19 19:52", "song": {"id": 1303708, "title": "Nara (Theme to Cold Case)", "duration": 291, "durationText": "4:51"}, "cue": {"id": "s2", "scene": "废弃剧院 · 后台的排练声", "target": [{"tag": "dark", "weight": 0.4}, {"tag": "dramatic", "weight": 0.25}, {"tag": "heavy", "weight": 0.2}, {"tag": "powerful", "weight": 0.15}]}, "base": {"quality": "lossless", "scheme": "full"}, "loadMs": {"mert": 9814, "clap": 1066, "perSong": 1360, "batch": 8}, "qualities": [{"key": "standard", "label": "128k", "name": "MP3 128k"}, {"key": "high", "label": "320k", "name": "MP3 320k"}, {"key": "lossless", "label": "无损", "name": "FLAC 无损"}], "schemes": [{"key": "full", "label": "整首"}, {"key": "120", "label": "前 120s"}, {"key": "60", "label": "前 60s"}, {"key": "3x10", "label": "10/50/90 各 10s"}], "rows": [{"quality": "standard", "qualityLabel": "128k", "qualityName": "MP3 128k", "scheme": "full", "schemeLabel": "整首", "bytesMB": 4.44, "downloadMs": 912, "decodeMs": 792, "predictMs": 6496, "vocalMs": 575, "totalMs": 8775, "audioSec": 291.0, "score": 0.315, "top": [["epic", 0.9102], ["film", 0.814], ["movie", 0.8], ["action", 0.7946], ["documentary", 0.7828]], "vocalP": 0.4347, "dScore": -0.0194, "cosine": 0.9993, "top1Match": true, "loadShareMs": 1360, "allMs": 10135}, {"quality": "standard", "qualityLabel": "128k", "qualityName": "MP3 128k", "scheme": "120", "schemeLabel": "前 120s", "bytesMB": 4.44, "downloadMs": 912, "decodeMs": 792, "predictMs": 2846, "vocalMs": 424, "totalMs": 4974, "audioSec": 120.0, "score": 0.2667, "top": [["epic", 0.8582], ["advertising", 0.8347], ["documentary", 0.8092], ["nature", 0.8073], ["movie", 0.7989]], "vocalP": 0.3183, "dScore": -0.0677, "cosine": 0.9839, "top1Match": true, "loadShareMs": 1360, "allMs": 6334}, {"quality": "standard", "qualityLabel": "128k", "qualityName": "MP3 128k", "scheme": "60", "schemeLabel": "前 60s", "bytesMB": 4.44, "downloadMs": 912, "decodeMs": 792, "predictMs": 1401, "vocalMs": 450, "totalMs": 3555, "audioSec": 60.0, "score": 0.207, "top": [["advertising", 0.9394], ["documentary", 0.8995], ["background", 0.8853], ["nature", 0.8785], ["movie", 0.8218]], "vocalP": 0.3183, "dScore": -0.1274, "cosine": 0.9233, "top1Match": false, "loadShareMs": 1360, "allMs": 4915}, {"quality": "standard", "qualityLabel": "128k", "qualityName": "MP3 128k", "scheme": "3x10", "schemeLabel": "10/50/90 各 10s", "bytesMB": 4.44, "downloadMs": 912, "decodeMs": 792, "predictMs": 753, "vocalMs": 422, "totalMs": 2879, "audioSec": 30.0, "score": 0.2417, "top": [["action", 0.9326], ["documentary", 0.9141], ["epic", 0.8829], ["advertising", 0.8774], ["movie", 0.8658]], "vocalP": 0.1875, "dScore": -0.0927, "cosine": 0.9546, "top1Match": false, "loadShareMs": 1360, "allMs": 4239}, {"quality": "high", "qualityLabel": "320k", "qualityName": "MP3 320k", "scheme": "full", "schemeLabel": "整首", "bytesMB": 11.1, "downloadMs": 1139, "decodeMs": 943, "predictMs": 6297, "vocalMs": 495, "totalMs": 8874, "audioSec": 291.0, "score": 0.3341, "top": [["epic", 0.9144], ["film", 0.829], ["movie", 0.8223], ["action", 0.8025], ["documentary", 0.7837]], "vocalP": 0.4164, "dScore": -0.0003, "cosine": 1.0, "top1Match": true, "loadShareMs": 1360, "allMs": 10234}, {"quality": "high", "qualityLabel": "320k", "qualityName": "MP3 320k", "scheme": "120", "schemeLabel": "前 120s", "bytesMB": 11.1, "downloadMs": 1139, "decodeMs": 943, "predictMs": 2655, "vocalMs": 442, "totalMs": 5179, "audioSec": 120.0, "score": 0.3098, "top": [["epic", 0.8626], ["advertising", 0.8399], ["movie", 0.8262], ["documentary", 0.8052], ["film", 0.7889]], "vocalP": 0.264, "dScore": -0.0246, "cosine": 0.9906, "top1Match": true, "loadShareMs": 1360, "allMs": 6539}, {"quality": "high", "qualityLabel": "320k", "qualityName": "MP3 320k", "scheme": "60", "schemeLabel": "前 60s", "bytesMB": 11.1, "downloadMs": 1139, "decodeMs": 943, "predictMs": 1424, "vocalMs": 421, "totalMs": 3927, "audioSec": 60.0, "score": 0.233, "top": [["advertising", 0.9501], ["documentary", 0.8963], ["background", 0.8692], ["nature", 0.8598], ["movie", 0.8443]], "vocalP": 0.264, "dScore": -0.1014, "cosine": 0.9257, "top1Match": false, "loadShareMs": 1360, "allMs": 5287}, {"quality": "high", "qualityLabel": "320k", "qualityName": "MP3 320k", "scheme": "3x10", "schemeLabel": "10/50/90 各 10s", "bytesMB": 11.1, "downloadMs": 1139, "decodeMs": 943, "predictMs": 757, "vocalMs": 435, "totalMs": 3274, "audioSec": 30.0, "score": 0.2524, "top": [["action", 0.9332], ["documentary", 0.9115], ["advertising", 0.8882], ["epic", 0.8881], ["movie", 0.8785]], "vocalP": 0.1433, "dScore": -0.082, "cosine": 0.9537, "top1Match": false, "loadShareMs": 1360, "allMs": 4634}, {"quality": "lossless", "qualityLabel": "无损", "qualityName": "FLAC 无损", "scheme": "full", "schemeLabel": "整首", "bytesMB": 32.61, "downloadMs": 3063, "decodeMs": 784, "predictMs": 6667, "vocalMs": 510, "totalMs": 11024, "audioSec": 291.0, "score": 0.3344, "top": [["epic", 0.9143], ["film", 0.8287], ["movie", 0.8224], ["action", 0.8024], ["documentary", 0.7836]], "vocalP": 0.3965, "dScore": 0.0, "cosine": 1.0, "top1Match": true, "loadShareMs": 1360, "allMs": 12384}, {"quality": "lossless", "qualityLabel": "无损", "qualityName": "FLAC 无损", "scheme": "120", "schemeLabel": "前 120s", "bytesMB": 32.61, "downloadMs": 3063, "decodeMs": 784, "predictMs": 2764, "vocalMs": 442, "totalMs": 7053, "audioSec": 120.0, "score": 0.3104, "top": [["epic", 0.8627], ["advertising", 0.8397], ["movie", 0.8262], ["documentary", 0.805], ["film", 0.7887]], "vocalP": 0.2565, "dScore": -0.024, "cosine": 0.9907, "top1Match": true, "loadShareMs": 1360, "allMs": 8413}, {"quality": "lossless", "qualityLabel": "无损", "qualityName": "FLAC 无损", "scheme": "60", "schemeLabel": "前 60s", "bytesMB": 32.61, "downloadMs": 3063, "decodeMs": 784, "predictMs": 1485, "vocalMs": 429, "totalMs": 5761, "audioSec": 60.0, "score": 0.2334, "top": [["advertising", 0.95], ["documentary", 0.8961], ["background", 0.8691], ["nature", 0.8599], ["movie", 0.8444]], "vocalP": 0.2565, "dScore": -0.101, "cosine": 0.9257, "top1Match": false, "loadShareMs": 1360, "allMs": 7121}, {"quality": "lossless", "qualityLabel": "无损", "qualityName": "FLAC 无损", "scheme": "3x10", "schemeLabel": "10/50/90 各 10s", "bytesMB": 32.61, "downloadMs": 3063, "decodeMs": 784, "predictMs": 839, "vocalMs": 449, "totalMs": 5135, "audioSec": 30.0, "score": 0.2531, "top": [["action", 0.933], ["documentary", 0.9111], ["epic", 0.8883], ["advertising", 0.8876], ["movie", 0.8786]], "vocalP": 0.1406, "dScore": -0.0813, "cosine": 0.954, "top1Match": false, "loadShareMs": 1360, "allMs": 6495}], "note": "时间为本机实测：下载完到本地、热态解码中位数、单曲推理与人声检测。「摊薄加载」= 每批 8 首平摊 MERT+CLAP 的 10.9s。"};

const Q = DATA.qualities;
const S = DATA.schemes;
const ROWS = DATA.rows;
const KEY = (q, s) => q + '|' + s;
const MAP = new Map(ROWS.map(r => [KEY(r.quality, r.scheme), r]));
const BASE = MAP.get(KEY(DATA.base.quality, DATA.base.scheme));
let selected = KEY(BASE.quality, BASE.scheme);
let metric = 'total';

const fmtMs = ms => (ms >= 1000 ? (ms / 1000).toFixed(2) + 's' : Math.round(ms) + 'ms');
const fmtScore = v => v.toFixed(3);
const fmtPct = v => (v * 100).toFixed(1) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function mix(a, b, t) {
  const p = (x, y) => Math.round(x + (y - x) * t);
  return `rgb(${p(a[0], b[0])},${p(a[1], b[1])},${p(a[2], b[2])})`;
}
// t: 0 = 好（绿），1 = 差（红）
function heat(t) {
  t = Math.max(0, Math.min(1, t));
  const g = [61, 220, 151], m = [255, 204, 102], r = [255, 107, 107];
  return t < 0.5 ? mix(g, m, t / 0.5) : mix(m, r, (t - 0.5) / 0.5);
}
function heatBg(t) {
  const c = heat(t).match(/\d+/g);
  return `rgba(${c[0]},${c[1]},${c[2]},0.16)`;
}

const METRICS = {
  total:  { label: '总耗时',   get: r => r.allMs,  fmt: fmtMs,  highIsBad: true },
  pred:   { label: '仅推理',   get: r => r.predictMs, fmt: fmtMs, highIsBad: true },
  score:  { label: '得分',     get: r => r.score,  fmt: fmtScore, highIsBad: false },
  dscore: { label: 'Δ 得分',   get: r => r.dScore, fmt: v => (v >= 0 ? '+' : '') + v.toFixed(3), highIsBad: false },
  cosine: { label: '余弦相似', get: r => r.cosine, fmt: v => v.toFixed(3), highIsBad: false }
};

/* ---------------- header ---------------- */
document.getElementById('meta').innerHTML =
  `<b>${esc(DATA.song.title)}</b> · ${DATA.song.durationText} · song_id ${DATA.song.id}<br>` +
  `段落 <b>${esc(DATA.cue.id)} ${esc(DATA.cue.scene)}</b> · 目标标签 ` +
  DATA.cue.target.map(t => `<b>${esc(t.tag)}</b> ${(t.weight * 100).toFixed(0)}%`).join(' / ') +
  `<br>生成于 ${DATA.generatedAt} · 基准 = 无损 × 整首（得分 ${fmtScore(BASE.score)}）· 本机 GPU 实测`;

/* ---------------- KPI ---------------- */
(function cards() {
  const fastest = [...ROWS].sort((a, b) => a.allMs - b.allMs)[0];
  const bestScore = [...ROWS].sort((a, b) => b.score - a.score)[0];
  const q128 = MAP.get(KEY('standard', 'full'));
  const qLoss = MAP.get(KEY('lossless', 'full'));
  const html = [
    ['基准：无损 · 整首', fmtScore(BASE.score), `top1 ${BASE.top[0][0]} ${fmtPct(BASE.top[0][1])}`],
    ['最快组合', fmtMs(fastest.allMs), `${fastest.qualityLabel} × ${fastest.schemeLabel}`],
    ['最高得分', fmtScore(bestScore.score), `${bestScore.qualityLabel} × ${bestScore.schemeLabel}`],
    ['128k 整首 vs 无损整首', (q128.dScore >= 0 ? '+' : '') + q128.dScore.toFixed(3),
      `得分 ${fmtScore(q128.score)} vs ${fmtScore(qLoss.score)} · 字节 ${q128.bytesMB}MB vs ${qLoss.bytesMB}MB`]
  ].map(([k, v, s]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
  document.getElementById('cards').innerHTML = html;
})();

/* ---------------- matrix ---------------- */
function renderMatrix() {
  const m = METRICS[metric];
  const vals = ROWS.map(r => m.get(r));
  const min = Math.min(...vals), max = Math.max(...vals);
  const norm = v => max === min ? 0.5 : (v - min) / (max - min);
  let html = '<table><thead><tr><th class="rowh">取样方案 \\ 音质</th>' +
    Q.map(q => `<th>${esc(q.label)}<br><span style="font-weight:400">${esc(q.name)}</span></th>`).join('') +
    '</tr></thead><tbody>';
  for (const s of S) {
    html += `<tr><td class="rowh">${esc(s.label)}</td>`;
    for (const q of Q) {
      const r = MAP.get(KEY(q.key, s.key));
      const v = m.get(r);
      const t = norm(v);
      const bad = m.highIsBad ? t : 1 - t;
      const sel = selected === KEY(q.key, s.key) ? ' sel' : '';
      const isBase = q.key === DATA.base.quality && s.key === DATA.base.scheme;
      html += `<td class="cell${sel}" data-key="${KEY(q.key, s.key)}" style="background:${heatBg(bad)}">
        <div class="big">${m.fmt(v)}${isBase ? ' <span style="color:var(--accent);font-size:11px">基准</span>' : ''}</div>
        <div class="sub">推理 ${fmtMs(r.predictMs)} · 得分 ${fmtScore(r.score)}</div></td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  const el = document.getElementById('matrix');
  el.innerHTML = html;
  el.querySelectorAll('.cell').forEach(c => c.onclick = () => select(c.dataset.key));
}

(function seg() {
  document.getElementById('metricSeg').innerHTML = Object.entries(METRICS)
    .map(([k, v]) => `<button data-m="${k}" class="${k === metric ? 'on' : ''}">${v.label}</button>`).join('');
  document.querySelectorAll('#metricSeg button').forEach(b => b.onclick = () => {
    metric = b.dataset.m;
    document.querySelectorAll('#metricSeg button').forEach(x => x.classList.toggle('on', x.dataset.m === metric));
    renderMatrix();
  });
})();

/* ---------------- bars ---------------- */
const SEGS = [
  ['downloadMs', '下载', '#4f8cff'],
  ['decodeMs', '解码', '#38bdf8'],
  ['predictMs', 'MERT 推理', '#a78bfa'],
  ['vocalMs', '人声 CLAP', '#f472b6'],
  ['loadShareMs', '摊薄加载', '#475569']
];

function renderBars() {
  const ordered = [...ROWS].sort((a, b) => a.allMs - b.allMs);
  const max = Math.max(...ROWS.map(r => r.allMs));
  const html = ordered.map(r => {
    const k = KEY(r.quality, r.scheme);
    const segs = SEGS.map(([f, , c]) => {
      const w = (r[f] / max) * 100;
      return `<div style="width:${w}%;background:${c}" title="${f} ${fmtMs(r[f])}"></div>`;
    }).join('');
    const sel = selected === k ? ' sel' : '';
    return `<div class="bar-row${sel}" data-key="${k}">
      <div class="bar-name" title="${esc(r.qualityLabel + ' × ' + r.schemeLabel)}">${esc(r.qualityLabel)} × ${esc(r.schemeLabel)}</div>
      <div class="bar-track">${segs}</div>
      <div class="bar-val">${fmtMs(r.allMs)}</div></div>`;
  }).join('');
  const el = document.getElementById('bars');
  el.innerHTML = html;
  el.querySelectorAll('.bar-row').forEach(n => n.onclick = () => select(n.dataset.key));
  document.getElementById('legend').innerHTML = SEGS
    .map(([, n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('') +
    `<span>合计含「摊薄加载」= ${fmtMs(DATA.loadMs.perSong)}（每批 ${DATA.loadMs.batch} 首平摊 ${fmtMs(DATA.loadMs.mert + DATA.loadMs.clap)}）</span>`;
}

/* ---------------- scatter ---------------- */
const QCOLOR = { standard: '#3ddc97', high: '#6aa9ff', lossless: '#ffcc66' };
function renderScatter() {
  const W = 880, H = 330, L = 62, R = 24, T = 20, B = 46;
  const xs = ROWS.map(r => r.allMs), ys = ROWS.map(r => r.score);
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const ymin = Math.min(...ys), ymax = Math.max(...ys);
  const pad = (a, b) => [(b - a) * 0.12 || 0.01, (b - a) * 0.18 || 0.02];
  const [xpad0, xpad1] = pad(xmin, xmax), [ypad0, ypad1] = pad(ymin, ymax);
  const X0 = xmin - xpad0, X1 = xmax + xpad1, Y0 = Math.max(0, ymin - ypad0), Y1 = ymax + ypad1;
  const x = v => L + (v - X0) / (X1 - X0) * (W - L - R);
  const y = v => H - B - (v - Y0) / (Y1 - Y0) * (H - T - B);

  let g = '';
  // 网格
  for (let i = 0; i <= 4; i++) {
    const yv = Y0 + (Y1 - Y0) * i / 4;
    g += `<line x1="${L}" x2="${W - R}" y1="${y(yv)}" y2="${y(yv)}" stroke="#232c3b" stroke-width="1"/>`;
    g += `<text x="${L - 8}" y="${y(yv) + 4}" fill="#8b97ab" font-size="11" text-anchor="end">${yv.toFixed(3)}</text>`;
    const xv = X0 + (X1 - X0) * i / 4;
    g += `<line y1="${T}" y2="${H - B}" x1="${x(xv)}" x2="${x(xv)}" stroke="#232c3b" stroke-width="1"/>`;
    g += `<text x="${x(xv)}" y="${H - B + 18}" fill="#8b97ab" font-size="11" text-anchor="middle">${(xv / 1000).toFixed(1)}s</text>`;
  }
  g += `<text x="${W / 2}" y="${H - 8}" fill="#8b97ab" font-size="11.5" text-anchor="middle">每首总耗时（含摊薄加载）</text>`;
  g += `<text x="14" y="${H / 2}" fill="#8b97ab" font-size="11.5" text-anchor="middle" transform="rotate(-90 14 ${H / 2})">段内得分</text>`;

  // 同名方案连线
  for (const s of S) {
    const pts = Q.map(q => MAP.get(KEY(q.key, s.key))).sort((a, b) => a.allMs - b.allMs);
    const d = pts.map((r, i) => (i ? 'L' : 'M') + x(r.allMs) + ' ' + y(r.score)).join(' ');
    g += `<path d="${d}" fill="none" stroke="#2c3648" stroke-width="1.4" stroke-dasharray="3 4"/>`;
  }
  for (const q of Q) {
    const pts = S.map(s => MAP.get(KEY(q.key, s.key))).sort((a, b) => a.allMs - b.allMs);
    const d = pts.map((r, i) => (i ? 'L' : 'M') + x(r.allMs) + ' ' + y(r.score)).join(' ');
    g += `<path d="${d}" fill="none" stroke="${QCOLOR[q.key]}" stroke-opacity=".35" stroke-width="1.6"/>`;
  }
  for (const r of ROWS) {
    const k = KEY(r.quality, r.scheme);
    const isBase = r === BASE;
    g += `<circle class="dot" data-key="${k}" cx="${x(r.allMs)}" cy="${y(r.score)}" r="${selected === k ? 7.5 : 5.5}"
      fill="${QCOLOR[r.quality]}" fill-opacity="${selected === k ? 1 : .78}"
      stroke="${selected === k ? '#dce7ff' : '#0e1117'}" stroke-width="${selected === k ? 2 : 1}">
      <title>${esc(r.qualityLabel)} × ${esc(r.schemeLabel)}｜${fmtMs(r.allMs)}｜得分 ${fmtScore(r.score)}</title></circle>`;
    if (isBase) g += `<text x="${x(r.allMs)}" y="${y(r.score) - 12}" fill="#dce7ff" font-size="11" text-anchor="middle">基准</text>`;
  }
  const el = document.getElementById('scatter');
  el.innerHTML = g;
  el.querySelectorAll('.dot').forEach(n => n.onclick = () => select(n.dataset.key));
}

/* ---------------- table ---------------- */
let sortKey = 'allMs', sortDir = 1;
const COLS = [
  ['qualityLabel', '音质', r => r.qualityLabel],
  ['schemeLabel', '方案', r => r.schemeLabel],
  ['bytesMB', '字节(MB)', r => r.bytesMB, 2],
  ['downloadMs', '下载', r => fmtMs(r.downloadMs)],
  ['decodeMs', '解码', r => fmtMs(r.decodeMs)],
  ['predictMs', '推理', r => fmtMs(r.predictMs)],
  ['vocalMs', '人声', r => fmtMs(r.vocalMs)],
  ['allMs', '合计', r => fmtMs(r.allMs), 0, r => r.allMs],
  ['score', '得分', r => fmtScore(r.score), 3, r => r.score],
  ['dScore', 'Δ得分', r => (r.dScore >= 0 ? '+' : '') + r.dScore.toFixed(3), 3, r => r.dScore],
  ['cosine', '余弦', r => r.cosine.toFixed(3), 3, r => r.cosine],
  ['top1Match', 'top1', r => r.top1Match ? '<span class="pill same">一致</span>' : '<span class="pill diff">变了</span>']
];

function renderTable() {
  const idx = {};
  COLS.forEach((c, i) => { idx[c[0]] = i; });
  const si = idx[sortKey] ?? 7;
  const sortFn = COLS[si][4];
  const rows = [...ROWS].sort((a, b) => {
    const av = sortFn ? sortFn(a) : COLS[si][2](a);
    const bv = sortFn ? sortFn(b) : COLS[si][2](b);
    if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortDir;
    return String(av).localeCompare(String(bv)) * sortDir;
  });
  let h = '<thead><tr>' + COLS.map(c =>
    `<th data-k="${c[0]}" class="${c[0] === sortKey ? 'on' : ''}">${c[1]}${c[0] === sortKey ? (sortDir > 0 ? ' ↑' : ' ↓') : ''}</th>`
  ).join('') + '</tr></thead><tbody>';
  for (const r of rows) {
    const k = KEY(r.quality, r.scheme);
    h += `<tr data-key="${k}" class="${selected === k ? 'sel' : ''}">` +
      COLS.map(c => `<td>${c[2](r)}</td>`).join('') + '</tr>';
  }
  h += '</tbody>';
  const el = document.getElementById('tbl');
  el.innerHTML = h;
  el.querySelectorAll('th').forEach(t => t.onclick = () => {
    if (sortKey === t.dataset.k) sortDir = -sortDir; else { sortKey = t.dataset.k; sortDir = 1; }
    renderTable();
  });
  el.querySelectorAll('tbody tr').forEach(n => n.onclick = () => select(n.dataset.key));
}

/* ---------------- detail ---------------- */
function renderDetail() {
  const r = MAP.get(selected);
  if (!r) return;
  const tags = r.top.map(([t, v]) => `<span class="tag">${esc(t)} <b>${fmtPct(v)}</b></span>`).join('');
  document.getElementById('detail').innerHTML =
    `<div class="hd">${esc(r.qualityLabel)} × ${esc(r.schemeLabel)}  ·  ${r.audioSec}s 音频${r === BASE ? '（基准）' : ''}</div>` +
    `<div class="kv">
      <span>文件 <b>${r.bytesMB} MB</b></span>
      <span>下载 <b>${fmtMs(r.downloadMs)}</b></span>
      <span>解码 <b>${fmtMs(r.decodeMs)}</b></span>
      <span>MERT <b>${fmtMs(r.predictMs)}</b></span>
      <span>人声 <b>${fmtMs(r.vocalMs)}</b></span>
      <span>合计 <b>${fmtMs(r.allMs)}</b></span>
      <span>得分 <b>${fmtScore(r.score)}</b>（Δ ${(r.dScore >= 0 ? '+' : '') + r.dScore.toFixed(3)}）</span>
      <span>与基准余弦 <b>${r.cosine.toFixed(3)}</b></span>
    </div><div class="tags">${tags}</div>`;
}

/* ---------------- conclusion ---------------- */
function renderTake() {
  const li = [];
  const q128full = MAP.get(KEY('standard', 'full'));
  const qLossfull = MAP.get(KEY('lossless', 'full'));
  li.push(`<b>音质不敏感</b>：128k × 整首 得分 ${fmtScore(q128full.score)}，无损 × 整首 ${fmtScore(qLossfull.score)}，
    差 ${(q128full.dScore >= 0 ? '+' : '') + q128full.dScore.toFixed(3)}，top1 都是 <code>${q128full.top[0][0]}</code>；
    但文件从 ${qLossfull.bytesMB}MB 降到 ${q128full.bytesMB}MB（${(q128full.bytesMB / qLossfull.bytesMB * 100).toFixed(0)}%）。`);

  const changed = ROWS.filter(r => !r.top1Match);
  if (changed.length) {
    li.push(`<b>取样会改变判断</b>：${changed.length} 个组合的 top1 与基准不同，例如 ` +
      changed.slice(0, 3).map(r => `${r.qualityLabel}×${r.schemeLabel} → <code>${r.top[0][0]}</code>`).join('、') +
      '。短取样把整曲的气质丢了。');
  }

  const best = [...ROWS].sort((a, b) => a.allMs - b.allMs)[0];
  const full128 = q128full;
  li.push(`<b>成本结构</b>：整首分析下 MERT 推理约 ${fmtMs(full128.predictMs)}，占总时 ${(full128.predictMs / full128.allMs * 100).toFixed(0)}%；
    摊薄加载 ${fmtMs(DATA.loadMs.perSong)}（${(DATA.loadMs.perSong / full128.allMs * 100).toFixed(0)}%）；
    下载 ${fmtMs(full128.downloadMs)}（${(full128.downloadMs / full128.allMs * 100).toFixed(0)}%）。`);

  li.push(`<b>最省</b>：${best.qualityLabel} × ${best.schemeLabel}，每首 ${fmtMs(best.allMs)}，得分 ${fmtScore(best.score)}
    （比整首低 ${Math.abs(best.dScore).toFixed(3)}）。`);
  li.push(`<b>当前默认（128k × 整首）</b>：每首 ${fmtMs(q128full.allMs)}；换成 320k 只多 ${fmtMs(MAP.get(KEY('high', 'full')).allMs - q128full.allMs)}，得分不变——预算宽裕时用 320k 更稳。`);
  document.getElementById('take').innerHTML = li.map(t => `<li>${t}</li>`).join('');
}

document.getElementById('foot').innerHTML =
  DATA.note + '<br>取样方案说明：整首 = 全曲；前 120s / 前 60s = 只算开头；' +
  '10/50/90 各 10s = 在 10%、50%、90% 位置各取 10 秒拼成 30 秒。' +
  '<br>得分 = Σ(目标标签概率 × 权重) × 负向惩罚 × 人声惩罚，只在同一段内可比。';

/* ---------------- select ---------------- */
function select(key) {
  selected = key;
  renderMatrix(); renderBars(); renderScatter(); renderTable(); renderDetail();
}
renderMatrix(); renderBars(); renderScatter(); renderTable(); renderDetail(); renderTake();
</script>
</body>
</html>
